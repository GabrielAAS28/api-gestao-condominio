services:
  postgres:
    image: postgres:16-alpine
    container_name: condigtal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-condigtal_dev}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-condigtal_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - condigtal-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: condigtal-api:local
    container_name: condigtal-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # garante que a API use o hostname do serviço Postgres dentro da rede do compose
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-condigtal_dev}?schema=public
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      # Persiste uploads no host
      - ./uploads:/app/uploads
    networks:
      - condigtal-net

volumes:
  postgres-data:

networks:
  condigtal-net:
    driver: bridge
